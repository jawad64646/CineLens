name: cinelens
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  flutter_secure_storage: ^11.0.0
  fan_carousel_image_slider: ^1.3.1
  youtube_player_iframe: ^5.2.2
  intl: ^0.20.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  connectivity_plus:
  internet_connection_checker_plus:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
